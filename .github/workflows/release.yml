# Publishes a GitHub Release from a version tag.
#
#   git tag -a v1.0.0-beta.1 -m "RadioGeddon v1.0.0 Beta 1" && git push origin v1.0.0-beta.1
#
# Flow: validate the tag, versions, release notes and download links
# (scripts/release_meta.py) -> rebuild all three .fap files from the tagged
# commit through the shared pipeline (build.yml) -> package + re-verify, write
# SHA256SUMS -> attest build provenance and verify the attestation -> create a
# DRAFT release with every asset -> download the assets back and check them ->
# publish. Any failure deletes the draft, so a partial or broken release is
# never made public.
# Tags with a pre-release suffix (e.g. -beta.1) are published as pre-releases.
#
# workflow_dispatch serves two purposes:
#   - dry_run=true: exercise the whole flow (build, package, draft upload,
#     re-download and verify) and then delete the private draft instead of
#     publishing. Drafts are not public and create no tag. Use before tagging.
#   - dry_run=false: fallback for environments that cannot push tags; builds the
#     selected branch head and the release creates the tag on that exact commit
#     when it is published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create on the selected branch head (e.g. v1.0.0-beta.1)
        required: true
        type: string
      dry_run:
        description: Build and stage a draft, verify it, then delete it (publish nothing)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      title: ${{ steps.meta.outputs.title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate tag, versions, release notes and download links
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then tag="$REF_NAME"; else tag="$INPUT_TAG"; fi
          # Tag = radiogeddon_version.h, fap_version, notes, CHANGELOG section,
          # API table = pins, README/INSTALLATION links = this tag.
          python3 scripts/release_meta.py --tag "$tag" --github-output "$GITHUB_OUTPUT"

          if [ "$EVENT" != "push" ] && [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "::error::tag $tag already exists; push-triggered runs build existing tags"; exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $(git rev-parse HEAD)"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
      TITLE: ${{ needs.prepare.outputs.title }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      EVENT: ${{ github.event_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          pattern: fap-*
          path: release
          merge-multiple: true

      - name: Package and verify artifacts
        run: scripts/package_release.sh release

      - name: Attest build provenance
        if: ${{ !github.event.repository.private && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/radiogeddon-*.fap

      # The same check users are told to run (docs/INSTALLATION.md), before
      # anything is uploaded.
      - name: Verify build provenance
        if: ${{ !github.event.repository.private && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          for fap in release/radiogeddon-*.fap; do
            gh attestation verify "$fap" --repo "$GH_REPO"
          done

      - name: Refuse to overwrite an existing release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::a release for $TAG already exists; delete it first or use a new tag"; exit 1
          fi

      - name: Create draft release with all assets
        run: |
          set -euo pipefail
          tail -n +2 "docs/releases/${TAG}.md" > "$RUNNER_TEMP/notes.md"
          args=(--draft --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --target "$SHA")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); else args+=(--latest); fi
          if [ "$EVENT" = "push" ]; then args+=(--verify-tag); fi
          gh release create "$TAG" "${args[@]}" \
            release/radiogeddon-official.fap \
            release/radiogeddon-unleashed.fap \
            release/radiogeddon-roguemaster.fap \
            release/SHA256SUMS \
            release/BUILD_INFO.txt

      - name: Verify uploaded assets
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/check"
          gh release download "$TAG" --dir "$RUNNER_TEMP/check"
          count="$(find "$RUNNER_TEMP/check" -type f | wc -l)"
          [ "$count" -eq 5 ] || { echo "::error::expected 5 assets, found $count"; exit 1; }
          (cd "$RUNNER_TEMP/check" && sha256sum -c SHA256SUMS)

      - name: Publish release
        if: env.DRY_RUN != 'true'
        run: gh release edit "$TAG" --draft=false

      - name: Dry run - delete the verified draft
        if: env.DRY_RUN == 'true'
        run: |
          gh release delete "$TAG" --yes
          echo "Dry run complete: draft for $TAG was built, uploaded, verified and deleted."

      - name: Delete draft on failure
        if: failure()
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
            echo "Deleted incomplete draft release $TAG"
          fi

      - name: Summary
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then echo "### Dry run OK: ${TITLE} (nothing published)"; else echo "### Published ${TITLE}"; fi
            echo "https://github.com/${GH_REPO}/releases/tag/${TAG}"
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
