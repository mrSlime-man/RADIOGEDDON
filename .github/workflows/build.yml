# Reusable build + verification pipeline, shared by CI (ci.yml) and releases
# (release.yml) so a release artifact passes exactly the same gates as a PR.
#
# Jobs:
#   docs        offline Markdown link/anchor check; version, release notes,
#               API table and download links agree (scripts/release_meta.py)
#   host-tests  host unit tests (both editions' switches) and the fuzz corpus
#               replay under ASan/UBSan, then the format tests on the
#               firmware's FlipperFormat code and Sub-GHz test files, the
#               decoder tests (its Sub-GHz decoders on its RAW captures), the
#               capture tests (the analyzer on those captures) and the engine
#               lifecycle tests (Scanner, Range Scanner, Hopper started and
#               stopped repeatedly, every allocation counted), all downloaded
#               at the pinned release, and the offline UI tests (Waterfall and
#               Bitstream Explorer drawn on a host canvas with the firmware's
#               fonts; synthetic previews kept as an artifact)
#   catalog     Apps Catalog requirements for the Catalog edition
#               (scripts/check_catalog.py)
#   fuzz        the fuzz targets under libFuzzer for a fixed time each
#   fap         one .fap per edition and firmware family, built against the
#               SDK pinned in scripts/firmware_pins.sh (checksum-verified), API
#               asserted, manifest and every imported symbol verified;
#               clang-format lint on the Catalog job; static analysis (GCC
#               -fanalyzer, clang-tidy) of each edition on the ufbt SDKs
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, tag or branch to build (default - the triggering ref)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  docs:
    name: docs (links)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Check Markdown links and anchors
        run: python3 scripts/check_links.py
      - name: Check version, release notes and download links agree
        run: python3 scripts/release_meta.py

  host-tests:
    name: host tests (ASan/UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Run unit tests
        run: make -C test check
      - name: Run format tests (firmware FlipperFormat code and test files)
        run: make -C test formats
      - name: Run decoder tests (firmware Sub-GHz decoders on its RAW test captures)
        run: make -C test decoders
      - name: Run capture tests (analyzer on the firmware's RAW test captures)
        run: make -C test captures
      - name: Run engine lifecycle tests (repeated start/stop, allocations counted)
        run: make -C test lifecycle
      - name: Run offline UI tests (screens on a host 128x64 canvas, firmware fonts)
        run: make -C test ui
      # Synthetic development previews of the drawing code: not device
      # screenshots, never for the Apps Catalog.
      - name: Keep the synthetic UI previews
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: synthetic-ui-previews
          path: test/build/ui/previews/*.png
          if-no-files-found: ignore
          retention-days: 14

  catalog:
    name: catalog (Apps Catalog checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch the pinned Apps Catalog tools
        run: |
          source scripts/firmware_pins.sh
          git init -q "$RUNNER_TEMP/catalog"
          git -C "$RUNNER_TEMP/catalog" fetch -q --depth 1 "$CATALOG_REPO" "$CATALOG_REF"
          git -C "$RUNNER_TEMP/catalog" checkout -q FETCH_HEAD
          python -m pip install --disable-pip-version-check -q -r "$RUNNER_TEMP/catalog/tools/requirements.txt" "ufbt==${UFBT_VERSION}"
      - name: Check the Catalog edition against the Apps Catalog rules
        run: python3 scripts/check_catalog.py --catalog "$RUNNER_TEMP/catalog"
      # The catalog's own bundler on this commit: clone, lint, build, manifest,
      # icon, description and changelog. Exit 2 means only the screenshots
      # (which must come from hardware) are missing.
      - name: Run the catalog's bundler (tools/bundle.py)
        env:
          COMMIT: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          python3 scripts/catalog_bundle.py "$RUNNER_TEMP/catalog" "$COMMIT"
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::Apps Catalog bundle: every step passed except screenshots, which need a Flipper Zero and qFlipper"
            rc=0
          fi
          exit "$rc"

  fuzz:
    name: fuzz (libFuzzer)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install the libFuzzer runtime if missing
        run: |
          printf 'int LLVMFuzzerTestOneInput(const char*d,long n){(void)d;(void)n;return 0;}\n' > /tmp/probe.c
          if ! clang-18 -fsanitize=fuzzer,address,undefined /tmp/probe.c -o /tmp/probe 2> /dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends libclang-rt-18-dev
          fi
      - name: Fuzz each target for 60 s
        run: make -C test fuzz FUZZ_CC=clang-18 FUZZ_TIME=60
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-failures
          path: test/build/*-crash-*
          if-no-files-found: ignore
          retention-days: 30

  fap:
    name: fap (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [catalog-official, full-roguemaster, full-momentum, full-unleashed]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned ufbt
        run: |
          source scripts/firmware_pins.sh
          python -m pip install --disable-pip-version-check "ufbt==${UFBT_VERSION}"

      - name: Build and verify (${{ matrix.target }})
        run: scripts/build_target.sh "${{ matrix.target }}" out

      - name: Lint (clang-format)
        if: matrix.target == 'catalog-official'
        env:
          UFBT_HOME: ${{ github.workspace }}/.ufbt-official
        run: ufbt lint

      # Each edition is analysed as it is built: the Catalog edition in the
      # checkout, the Full edition in the copy build_target.sh staged.
      - name: Static analysis (GCC -fanalyzer, clang-tidy)
        if: matrix.target != 'full-roguemaster'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          command -v clang-tidy-18 > /dev/null || sudo apt-get install -y -q --no-install-recommends clang-tidy-18
          export UFBT_HOME="${GITHUB_WORKSPACE}/.ufbt-${TARGET#*-}"
          root=.
          if [ "${TARGET%%-*}" = full ]; then root=".stage/${TARGET}"; fi
          CLANG_TIDY=clang-tidy-18 python3 scripts/static_analysis.py --root "$root"

      - name: Summary
        run: |
          {
            echo "### radiogeddon-${{ matrix.target }}.fap"
            echo '```'
            cat "out/radiogeddon-${{ matrix.target }}.build-info"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: fap-${{ matrix.target }}
          path: |
            out/radiogeddon-${{ matrix.target }}.fap
            out/radiogeddon-${{ matrix.target }}.build-info
          if-no-files-found: error
          retention-days: 30
