# Reusable build + verification pipeline, shared by CI (ci.yml) and releases
# (release.yml) so a release artifact passes exactly the same gates as a PR.
#
# Jobs:
#   docs        offline Markdown link/anchor check; version, release notes,
#               API table and download links agree (scripts/release_meta.py)
#   host-tests  host unit tests and the fuzz corpus replay under ASan/UBSan,
#               then the format tests on the firmware's FlipperFormat code and
#               Sub-GHz test files (downloaded at the pinned release)
#   fuzz        the fuzz targets under libFuzzer for a fixed time each
#   fap         one .fap per firmware family, built against the SDK pinned in
#               scripts/firmware_pins.sh (checksum-verified), API asserted,
#               manifest verified; clang-format lint on the official job;
#               static analysis (GCC -fanalyzer, clang-tidy) on the ufbt SDKs
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, tag or branch to build (default - the triggering ref)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  docs:
    name: docs (links)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Check Markdown links and anchors
        run: python3 scripts/check_links.py
      - name: Check version, release notes and download links agree
        run: python3 scripts/release_meta.py

  host-tests:
    name: host tests (ASan/UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Run unit tests
        run: make -C test check
      - name: Run format tests (firmware FlipperFormat code and test files)
        run: make -C test formats

  fuzz:
    name: fuzz (libFuzzer)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install the libFuzzer runtime if missing
        run: |
          printf 'int LLVMFuzzerTestOneInput(const char*d,long n){(void)d;(void)n;return 0;}\n' > /tmp/probe.c
          if ! clang-18 -fsanitize=fuzzer,address,undefined /tmp/probe.c -o /tmp/probe 2> /dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends libclang-rt-18-dev
          fi
      - name: Fuzz each target for 60 s
        run: make -C test fuzz FUZZ_CC=clang-18 FUZZ_TIME=60
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-failures
          path: test/build/*-crash-*
          if-no-files-found: ignore
          retention-days: 30

  fap:
    name: fap (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [official, unleashed, roguemaster]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned ufbt
        run: |
          source scripts/firmware_pins.sh
          python -m pip install --disable-pip-version-check "ufbt==${UFBT_VERSION}"

      - name: Build and verify (${{ matrix.target }})
        run: scripts/build_target.sh "${{ matrix.target }}" out

      - name: Lint (clang-format)
        if: matrix.target == 'official'
        env:
          UFBT_HOME: ${{ github.workspace }}/.ufbt-official
        run: ufbt lint

      - name: Static analysis (GCC -fanalyzer, clang-tidy)
        if: matrix.target != 'roguemaster'
        env:
          UFBT_HOME: ${{ github.workspace }}/.ufbt-${{ matrix.target }}
        run: |
          command -v clang-tidy-18 > /dev/null || sudo apt-get install -y -q --no-install-recommends clang-tidy-18
          CLANG_TIDY=clang-tidy-18 python3 scripts/static_analysis.py

      - name: Summary
        run: |
          {
            echo "### radiogeddon-${{ matrix.target }}.fap"
            echo '```'
            cat "out/radiogeddon-${{ matrix.target }}.build-info"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: fap-${{ matrix.target }}
          path: |
            out/radiogeddon-${{ matrix.target }}.fap
            out/radiogeddon-${{ matrix.target }}.build-info
          if-no-files-found: error
          retention-days: 30
